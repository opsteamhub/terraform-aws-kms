name: Terraform

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.64.0
          cache: true
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --recursive --format compact
      - run: python -m pip install --disable-pip-version-check --no-input check-jsonschema==0.38.0
      - run: check-jsonschema --schemafile "$(jq -r '.["$schema"]' .kiro/agents/local-agent.json)" .kiro/agents/local-agent.json
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          hide-progress: true
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          version: v0.74.0

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform test -test-directory=testing
      - run: terraform -chdir=examples/basic init -backend=false -input=false
      - run: terraform -chdir=examples/basic validate
